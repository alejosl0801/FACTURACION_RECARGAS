<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#c0392b" />
  <title>Facturación Rápida · Recargas</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ============ PANTALLA: FACTURACIÓN ============ -->
  <section id="screen-main" class="screen active">
    <header class="topbar">
      <span class="topbar-title" id="topbar-title">
        <img src="logo-app.png" class="brand-logo" alt="PREVIFUEGO" /> PREVIFUEGO
      </span>
      <button id="btn-historial" title="Historial de facturas"
        style="background:none;border:none;color:#fff;font-size:24px;cursor:pointer">🧾</button>
    </header>
    <input id="file-clientes" type="file" accept=".json,.csv,application/json" style="display:none" />
    <div id="offline-bar" class="offline-bar">⚠️ Sin internet — revisá la señal</div>

    <div class="content">
      <div id="saludo" class="saludo"></div>

      <!-- Cliente -->
      <div class="card">
        <h2>Cliente</h2>
        <label>Cédula / RUC</label>
        <div class="row">
          <input id="cliente-id" type="tel" inputmode="numeric" placeholder="Cédula o RUC" autocomplete="off" />
          <button id="btn-sri" class="btn-secondary">🔎 Buscar en SRI</button>
        </div>
        <p id="sri-msg" class="sri-msg"></p>
        <label>Nombre / Razón social</label>
        <input id="cliente-nombre" type="text" placeholder="Se llena con el SRI" autocomplete="off" />
        <label>Dirección</label>
        <input id="cliente-dir" type="text" placeholder="Se llena con el SRI" autocomplete="off" />
        <div class="row">
          <div class="col">
            <label>Teléfono</label>
            <input id="cliente-tel" type="tel" inputmode="numeric" placeholder="09..." autocomplete="off" />
          </div>
          <div class="col">
            <label>Email</label>
            <input id="cliente-email" type="email" placeholder="correo@..." autocomplete="off" />
          </div>
        </div>
      </div>

      <!-- Productos -->
      <div class="card">
        <h2>Productos</h2>
        <div class="cat-tabs">
          <button class="cat-tab active" data-cat="PQS">PQS</button>
          <button class="cat-tab" data-cat="CO2">CO2</button>
        </div>
        <div id="lista-productos" class="lista-productos"></div>
      </div>

      <!-- Carrito -->
      <div class="card" id="card-carrito" style="display:none">
        <h2>Detalle</h2>
        <div id="carrito"></div>
        <div class="totales">
          <div class="tot-row"><span>Subtotal</span><span id="t-subtotal">$0.00</span></div>
          <div class="tot-row"><span>IVA 15%</span><span id="t-iva">$0.00</span></div>
          <div class="tot-row tot-total"><span>TOTAL</span><span id="t-total">$0.00</span></div>
        </div>
        <label>Forma de pago</label>
        <div class="pago-opts">
          <button class="pago-opt active" data-pago="efectivo">💵 Efectivo</button>
          <button class="pago-opt" data-pago="transferencia">🏦 Transferencia</button>
        </div>
      </div>
    </div>

    <div class="footer-bar">
      <p id="facturar-hint" class="facturar-hint"></p>
      <button id="btn-facturar" class="btn-facturar" disabled>FACTURAR</button>
    </div>
  </section>

  <!-- ============ HISTORIAL ============ -->
  <section id="screen-historial" class="screen">
    <header class="topbar">
      <button id="btn-hist-volver"
        style="background:none;border:none;color:#fff;font-size:17px;font-weight:700;cursor:pointer">← Volver</button>
      <span class="topbar-title">Últimas facturas</span>
      <span style="width:60px"></span>
    </header>
    <div class="content">
      <div id="lista-historial" class="lista-historial"></div>
    </div>
  </section>

  <!-- ============ PANTALLA 3: COMPROBANTE ============ -->
  <section id="screen-result" class="screen">
    <div class="result-actions no-print">
      <button id="btn-imprimir" class="btn-facturar">🖨️ IMPRIMIR</button>
      <button id="btn-nueva" class="btn-secondary">NUEVO</button>
    </div>
    <div id="comprobante" class="comprobante"></div>
  </section>

  <!-- ============ OVERLAY CARGANDO ============ -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Emitiendo factura...</p>
    <p style="font-size:14px;color:#7f8c8d">Esto puede tardar unos segundos, no cierres la app.</p>
  </div>

  <script src="barcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
